<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra biểu mẫu bằng JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .form-container {
            background-color: #FFFFFF;
            border: 1px solid #fed7aa;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .form-header h2 {
            color: #c2410c;
            margin: 0 0 5px 0;
            font-size: 22px;
        }

        .form-header p {
            color: #64748b;
            font-size: 14px;
            margin: 0 0 20px 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-group.success input {
            border-color: #16a34a;
        }

        .form-group.error input {
            border-color: #dc2626;
        }

        .message {
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .form-group.error .message {
            display: block;
            color: #dc2626;
        }

        .form-group.success .message {
            display: block;
            color: #16a34a;
        }

        .btn-submit {
            background-color: #c2410c;
            color: #FFFFFF;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="form-header">
            <h2>Đăng ký tài khoản</h2>
            <p>Dữ liệu được kiểm tra bằng JavaScript trước khi gửi.</p>
        </div>

        <form id="signup-form" onsubmit="return validateForm(event)">
            <div class="form-group" id="group-name">
                <label>Họ và tên</label>
                <input type="text" id="fullname" placeholder="Nhập họ và tên...">
                <div class="message" id="msg-name"></div>
            </div>

            <div class="form-group" id="group-email">
                <label>Email</label>
                <input type="text" id="email" placeholder="Nhập email...">
                <div class="message" id="msg-email"></div>
            </div>

            <div class="form-group" id="group-password">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu...">
                <div class="message" id="msg-password"></div>
            </div>

            <div class="form-group" id="group-confirm">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu...">
                <div class="message" id="msg-confirm"></div>
            </div>

            <button type="submit" class="btn-submit">Đăng ký</button>
        </form>
    </div>

    <script>
        function validateForm(event) {
            event.preventDefault(); 

            let isValid = true;

            // 1. Kiểm tra Họ và tên (không được để trống)
            const fullnameInput = document.getElementById('fullname');
            const groupName = document.getElementById('group-name');
            const msgName = document.getElementById('msg-name');
            if (fullnameInput.value.trim() === '') {
                setError(groupName, msgName, '✗ Họ và tên không được để trống');
                isValid = false;
            } else {
                setSuccess(groupName, msgName, '✓ Hợp lệ');
            }

            // 2. Kiểm tra Email (định dạng cơ bản)
            const emailInput = document.getElementById('email');
            const groupEmail = document.getElementById('group-email');
            const msgEmail = document.getElementById('msg-email');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (emailInput.value.trim() === '') {
                setError(groupEmail, msgEmail, '✗ Email không được để trống');
                isValid = false;
            } else if (!emailRegex.test(emailInput.value.trim())) {
                setError(groupEmail, msgEmail, '✗ Email không hợp lệ (thiếu tên miền hoặc ký tự)');
                isValid = false;
            } else {
                setSuccess(groupEmail, msgEmail, '✓ Hợp lệ');
            }

            // 3. Kiểm tra Mật khẩu (ít nhất 6 ký tự)
            const passwordInput = document.getElementById('password');
            const groupPassword = document.getElementById('group-password');
            const msgPassword = document.getElementById('msg-password');
            if (passwordInput.value.length < 6) {
                setError(groupPassword, msgPassword, '✗ Mật khẩu phải có ít nhất 6 ký tự');
                isValid = false;
            } else {
                setSuccess(groupPassword, msgPassword, '✓ Hợp lệ');
            }

            // 4. Kiểm tra Xác nhận mật khẩu (phải khớp)
            const confirmInput = document.getElementById('confirm-password');
            const groupConfirm = document.getElementById('group-confirm');
            const msgConfirm = document.getElementById('msg-confirm');
            if (confirmInput.value === '') {
                setError(groupConfirm, msgConfirm, '✗ Vui lòng xác nhận mật khẩu');
                isValid = false;
            } else if (confirmInput.value !== passwordInput.value) {
                setError(groupConfirm, msgConfirm, '✗ Xác nhận mật khẩu không khớp');
                isValid = false;
            } else {
                setSuccess(groupConfirm, msgConfirm, '✓ Hợp lệ');
            }

            // Nếu toàn bộ hợp lệ thì thông báo thành công
            if (isValid) {
                alert('Đăng ký tài khoản thành công!');
                // document.getElementById('signup-form').submit(); // Bỏ comment nếu muốn gửi form thật
            }

            return false;
        }

        // Hàm bổ trợ hiển thị lỗi
        function setError(group, msgElement, message) {
            group.className = 'form-group error';
            msgElement.textContent = message;
        }

        // Hàm bổ trợ hiển thị thành công
        function setSuccess(group, msgElement, message) {
            group.className = 'form-group success';
            msgElement.textContent = message;
        }
    </script>
</body>
</html>
