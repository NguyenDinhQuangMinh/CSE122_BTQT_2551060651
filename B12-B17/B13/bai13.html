<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đồng hồ số</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .main-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .clock-box {
            background-color: #000000;
            padding: 25px 35px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .clock-box img {
            height: 52px;
            display: block;
        }

        .greeting-box {
            background-color: #FFFFFF;
            color: #C62828;
            font-style: italic;
            font-size: 28px;
            font-weight: bold;
            padding: 20px 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="clock-box">
            <img id="h1" src="anh/00.gif" alt="H1">
            <img id="h2" src="anh/00.gif" alt="H2">
            <img src="anh/haicham.gif" alt="Hai Cham">
            <img id="m1" src="anh/00.gif" alt="M1">
            <img id="m2" src="anh/00.gif" alt="M2">
            <img src="anh/haicham.gif" alt="Hai Cham">
            <img id="s1" src="anh/00.gif" alt="S1">
            <img id="s2" src="anh/00.gif" alt="S2">
        </div>

        <div id="greeting" class="greeting-box">Chào buổi sáng!</div>
    </div>

    <script>

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            let hTens = Math.floor(hours / 10);
            let hUnits = hours % 10;
            let mTens = Math.floor(minutes / 10);
            let mUnits = minutes % 10;
            let sTens = Math.floor(seconds / 10);
            let sUnits = seconds % 10;

            document.getElementById('h1').src = `anh/0${hTens}.gif`;
            document.getElementById('h2').src = `anh/0${hUnits}.gif`;
            document.getElementById('m1').src = `anh/0${mTens}.gif`;
            document.getElementById('m2').src = `anh/0${mUnits}.gif`;
            document.getElementById('s1').src = `anh/0${sTens}.gif`;
            document.getElementById('s2').src = `anh/0${sUnits}.gif`;

            let greetingText = '';
            if (hours < 12) {
                greetingText = 'Chào buổi sáng!';
            } else if (hours < 18) {
                greetingText = 'Chào buổi chiều!';
            } else {
                greetingText = 'Chào buổi tối!';
            }
            document.getElementById('greeting').textContent = greetingText;
        }
        updateClock();

        setInterval(updateClock, 1000);
        
    </script>
</body>
</html>
