<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang giới thiệu địa danh</title>
    <link rel="stylesheet" href="bai23.css">
</head>
<body>
    <div class="container">
        <div class="gallery-header">
            <h2>Thư viện ảnh — Hiệu ứng Hover</h2>
            <p>Rê chuột lên ảnh để thấy hiệu ứng phóng to (zoom) và lớp phủ chú thích.</p>
        </div>

        <div class="gallery-grid">
            <!-- Ảnh 1 -->
            <div class="gallery-item">
                <img src="Bai23/1-vinh-ha-long.jpg" alt="Vịnh Hạ Long">
                <div class="overlay">
                    <span>Vịnh Hạ Long</span>
                </div>
            </div>

            <div class="gallery-item">
                <img src="Bai23/2-son-doong.jpg" alt="Hang Sơn Đoòng">
                <div class="overlay">
                    <span>Hang Sơn Đoòng</span>
                </div>
            </div>

            <div class="gallery-item">
                <img src="Bai23/3-thac-ban-gioc.jpg" alt="Thác Bản Giốc">
                <div class="overlay">
                    <span>Thác Bản Giốc</span>
                </div>
            </div>

            <div class="gallery-item">
                <img src="Bai23/4-fansipan.jpg" alt="Fansipan">
                <div class="overlay">
                    <span>Fansipan</span>
                </div>
            </div>

            <div class="gallery-item">
                <img src="Bai23/5-mekong.jpg" alt="Đồng bằng sông Cửu Long">
                <div class="overlay">
                    <span>Đồng bằng sông Cửu Long</span>
                </div>
            </div>

            <div class="gallery-item">
                <img src="Bai23/6-phong-nha.jpg" alt="Động Phong Nha">
                <div class="overlay">
                    <span>Động Phong Nha</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
